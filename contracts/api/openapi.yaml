openapi: 3.1.0

info:
  title: Galerie API
  version: 0.6.2
  license:
    name: MIT License
    identifier: MIT
  description: |
    本APIは、Galerieアプリケーションが画像やPDF化した漫画等のマルチメディアを提供するためのAPIである。

    なお、このAPI自体はコンテンツそのものの配信を行わない。クライアントは本APIからコンテンツのメタデータを取得し、その中に含まれる情報を使ってコンテンツを取得する。

servers:
  - url: /api/v0
    description: API Version 0

tags:
  - name: Contents
    description: コンテンツファイルに関するAPI
  - name: ContentAccess
    description: コンテンツ配信エンドポイントへのアクセス設定に関するAPI
  - name: TagSchema
    description: タグスキーマに関するAPI

security: []

paths:
  /tag-schema:
    get:
      operationId: getTagSchema
      tags:
        - TagSchema
      summary: タグスキーマの取得
      description: |
        コンテンツの登録・検索・診断に使用される、現在有効なタグスキーマを返す。
        スキーマが設定されていない場合は、既定のスキーマを返す。
      responses:
        "200":
          description: タグスキーマ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagSchema"
              examples:
                configured:
                  summary: タグ定義があるスキーマ
                  value:
                    version: "0"
                    allowAdditionalTags: false
                    required:
                      - key: subjects
                        type: textSet
                    optional:
                      - key: category
                        type: text
                        allowedValues: [landscape, abstract]
                      - key: animation
                        type: keyOnly
                default:
                  summary: スキーマが設定されていない場合
                  value:
                    version: "0"
                    allowAdditionalTags: true
                    required: []
                    optional: []
        "500":
          $ref: "#/components/responses/InternalServerError"

  /content-access:
    post:
      operationId: configureContentAccess
      tags:
        - ContentAccess
      summary: コンテンツアクセスの設定
      description: |
        コンテンツ配信エンドポイントへアクセスするために必要な認可情報をクライアントに設定する。

        認可情報が必要な構成では、レスポンスの`Set-Cookie`ヘッダーによって設定する。
        Cookieの具体的な内容は実装の詳細であり、クライアントは解釈または直接操作してはならない。

        レスポンスに`invalidAfter`が含まれる場合、その時刻以降は設定された認可情報の有効性を保証しない。
        クライアントは`invalidAfter`より前の任意の時刻に本APIを再度実行し、コンテンツアクセス設定を更新できる。
      responses:
        "200":
          description: コンテンツアクセスに必要な設定が完了した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentAccessConfiguration"
              examples:
                refreshRequired:
                  summary: 期限までに更新が必要な設定
                  value:
                    invalidAfter: "2026-09-16T12:30:00Z"
                refreshNotRequired:
                  summary: 更新が不要な設定
                  value: {}
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: clearContentAccess
      tags:
        - ContentAccess
      summary: コンテンツアクセス設定の解除
      description: |
        コンテンツ配信エンドポイントへアクセスするために設定された認可情報をクライアントから削除する。

        認可情報が設定される構成では、レスポンスの`Set-Cookie`ヘッダーによって削除する。
        Cookieの具体的な内容は実装の詳細であり、クライアントは解釈または直接操作してはならない。
      responses:
        "204":
          description: コンテンツアクセス設定の解除が完了した
        "500":
          $ref: "#/components/responses/InternalServerError"

  /contents:
    post:
      operationId: createContent
      tags:
        - Contents
      summary: コンテンツの登録
      description: |
        コンテンツファイルをタグとともに登録する。
        いずれかのタグが不正な場合はエラーを返し、コンテンツは登録されない。
        タグがすべて正しい場合のみ、タグをXMPサイドカーに保存してコンテンツを登録する。
      requestBody:
        description: コンテンツファイルと登録するタグ
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [content, metadata]
              properties:
                content:
                  # OpenAPI Generator 7.24.0でBlob/Bytesとして生成するための互換表記。
                  type: string
                  format: binary
                  description: AVIFコンテンツファイルの生バイト列
                metadata:
                  $ref: "#/components/schemas/ContentMetadataInput"
            encoding:
              content:
                contentType: image/avif
              metadata:
                contentType: application/json
      responses:
        "201":
          description: コンテンツとすべてのタグを登録した。返却するdiagnosticsは空配列
          headers:
            Location:
              description: 登録したコンテンツの個別取得APIへの相対パス
              schema:
                type: string
                example: /api/v0/contents/2f1c75fc-55de-4d4b-8992-76050f65dff0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"
        "400":
          description: コンテンツファイル、タグ、またはタグ全体の制約が不正であり、登録しなかった
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BadRequestProblem"
              example:
                type: https://api.example.com/problems/invalid-content-registration
                title: Invalid content registration
                status: 400
                detail: The tag key "category" is not allowed.
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      operationId: listContents
      tags:
        - Contents
      summary: コンテンツ一覧の取得
      description: |
        コンテンツの一覧をカーソル方式で取得する。
        最初のリクエストでは`cursor`を指定せず、続きがある場合はレスポンスの`nextCursor`を次のリクエストにそのまま指定する。
        また、`condition`を用いることで検索条件を指定した一覧取得が可能である。

        カーソルの値自体は無意味であり、クライアントはその内容を解釈してはいけない。
        コンテンツは`id`の昇順で返される。

        対応するメタデータを読み取れないコンテンツは一覧対象から除外する。
        `limit`・`nextCursor`及び最終ページの判定は、読み取り不能なコンテンツの除外と検索条件による絞り込み後の一覧に対して作用する。
        ただし、スキーマ違反となるコンテンツであっても、対応するメタデータが読み取れる場合には一覧対象に含める。

        各ページはリクエスト時点のコンテンツを対象とするため、一連の呼び出し中にコンテンツが追加・削除された場合やメタデータの変更によって取得可能性や検索条件への一致が変わった場合、後続のリクエストはその更新の内容を反映する。
        その結果、カーソル以前の位置に追加されたコンテンツやカーソル以降の位置で削除されたコンテンツは以降のリクエストには含まれない。
        最新のコンテンツを取得するためには、`cursor`を指定せずに一覧取得を再開する必要がある。

        `nextCursor`がない場合、そのページは最終ページであり、`items`の要素数は0以上である。
        `nextCursor`がある場合、`items`には1件以上のコンテンツが含まれる。

        検索条件は複数の項のAND条件として扱われ、正しくURLエンコードされたJSON配列として指定された場合のみ有効となり、無効な場合エラーとなる。
        タグに関する検索条件の値は文字列で指定し、タグスキーマに定義がある場合はその定義に従って解釈する。
        定義がない場合は、タグスキーマがそのキーを許容する場合に限りTextとして解釈する。この際値の字句からIntegerやRealを推測しない。
        タグのキーや値がフォーマットまたはタグスキーマに違反する項が1つでもある場合はエラーとなる。
        この基準を満たす場合であれば、JSON文字列の空白・プロパティ順や配列の順番は問わず同一の検索条件として扱われる。

        検索を行う際、ページをまたぐ後続のリクエストは初回リクエスト時と同一の検索条件を指定する必要がある。
        初回とは異なる検索条件を指定した場合、正しい結果は保証されない。

        `condition`の省略と空配列は同一の検索条件として扱い、その場合には全件を対象とする。

        ##### 検索リクエストの例
        ```sh
        curl --get 'http://localhost:8000/api/v0/contents' \
          --data-urlencode 'condition=[{"kind":"tagMatch","key":"category","values":["landscape","portrait"]},{"kind":"tagMatch","key":"rating","values":["5"]}]' \
          --data-urlencode 'limit=30'
        ```

        上記の例では、`category`が`landscape`または`portrait`で、タグスキーマでIntegerと定義された`rating`が整数の`5`であるコンテンツを検索する。

      x-codeSamples:
        - lang: curl
          source: |
            curl --get 'http://localhost:8000/api/v0/contents' \
              --data-urlencode 'condition=[{"kind":"tagMatch","key":"category","values":["landscape","portrait"]},{"kind":"tagMatch","key":"rating","values":["5"]}]' \
              --data-urlencode 'limit=30'
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/SearchCondition"
      responses:
        "200":
          description: コンテンツ一覧の正常な取得
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPage"
              examples:
                firstPage:
                  summary: 途中のページ
                  value:
                    items:
                      - id: 2f1c75fc-55de-4d4b-8992-76050f65dff0
                        mediaType: image/avif
                        contentUrl: https://content.example.com/2f1c75fc-55de-4d4b-8992-76050f65dff0.avif
                        thumbnailUrl: https://content.example.com/2f1c75fc-55de-4d4b-8992-76050f65dff0.avif
                        tags:
                          - key: category
                            type: text
                            value: landscape
                          - key: animation
                            type: keyOnly
                          - key: rating
                            type: integer
                            value: 5
                          - key: score
                            type: real
                            value: 3.14
                          - key: authors
                            type: textSet
                            values: [Alice, Bob]
                          - key: pages
                            type: integerSet
                            values: [1, 3]
                          - key: weights
                            type: realSet
                            values: [0.5, 1.5]
                        diagnostics:
                          - key: Invalid-Key
                            kind: invalidKey
                          - key: OrderedArray
                            kind: unsupportedXmpValueType
                          - key: EmptyStringSet
                            kind: unparseableTagValue
                          - key: title
                            kind: missingRequiredTag
                            definition:
                              key: title
                              type: text
                    nextCursor: eyJhZnRlciI6IjJmMWM3NWZjIn0
                lastPage:
                  summary: 最終ページ
                  value:
                    items:
                      - id: 7b0b8b8e-3c3d-4c12-9a4a-75e60d5c9e31
                        mediaType: image/avif
                        contentUrl: https://content.example.com/7b0b8b8e-3c3d-4c12-9a4a-75e60d5c9e31.avif
                        thumbnailUrl: https://content.example.com/7b0b8b8e-3c3d-4c12-9a4a-75e60d5c9e31.avif
                        tags: []
                        diagnostics: []
                emptyPage:
                  summary: コンテンツが存在しないもしくは検索結果が0件
                  value:
                    items: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /contents/{contentId}:
    get:
      operationId: getContent
      tags:
        - Contents
      summary: コンテンツの取得
      description: |
        個々のコンテンツに対してコンテンツの情報を取得する。
        コンテンツファイルの存在だけではなく対応するメタデータの取得を必須条件とする。

      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: コンテンツの正常な取得
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"
              example:
                id: 2f1c75fc-55de-4d4b-8992-76050f65dff0
                mediaType: image/avif
                contentUrl: https://content.example.com/2f1c75fc-55de-4d4b-8992-76050f65dff0.avif
                thumbnailUrl: https://content.example.com/2f1c75fc-55de-4d4b-8992-76050f65dff0.avif
                tags:
                  - key: category
                    type: text
                    value: landscape
                  - key: animation
                    type: keyOnly
                  - key: rating
                    type: integer
                    value: 5
                  - key: score
                    type: real
                    value: 3.14
                  - key: authors
                    type: textSet
                    values: [Alice, Bob]
                  - key: pages
                    type: integerSet
                    values: [1, 3]
                  - key: weights
                    type: realSet
                    values: [0.5, 1.5]
                diagnostics:
                  - key: Invalid-Key
                    kind: invalidKey
                  - key: OrderedArray
                    kind: unsupportedXmpValueType
                  - key: EmptyStringSet
                    kind: unparseableTagValue
                  - key: title
                    kind: missingRequiredTag
                    definition:
                      key: title
                      type: text
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ContentNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    ContentId:
      name: contentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ContentId"

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        一覧取得時のページネーションに用いるカーソル。

      schema:
        type: string
        minLength: 1
      example: eyJhZnRlciI6IjJmMWM3NWZjIn0

    SearchCondition:
      name: condition
      in: query
      required: false
      description: |
        検索条件の項のJSON配列をURLエンコードした値。
        省略または空配列は全件を表す。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchCondition"

    PageLimit:
      name: limit
      in: query
      required: false
      description: |
        1ページに含めるコンテンツの最大件数。
        継続リクエストでは直前のリクエストと異なる値を指定してもよい。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
      example: 30

  schemas:
    TagSchemaVersion:
      type: string
      const: "0"
      description: タグスキーマの形式バージョン

    TagSchema:
      type: object
      description: コンテンツの登録・検索・診断に適用するタグスキーマ
      additionalProperties: false
      required: [version, allowAdditionalTags, required, optional]
      properties:
        version:
          $ref: "#/components/schemas/TagSchemaVersion"
        allowAdditionalTags:
          type: boolean
          description: 定義されていないキーのタグを許可するか
        required:
          type: array
          description: 必須タグの定義。定義がない場合は空配列
          items:
            $ref: "#/components/schemas/TagDefinition"
        optional:
          type: array
          description: 任意タグの定義。定義がない場合は空配列
          items:
            $ref: "#/components/schemas/TagDefinition"

    ContentMetadataInput:
      type: object
      description: コンテンツに設定するメタデータ
      additionalProperties: false
      required: [tags]
      properties:
        tags:
          type: array
          description: 設定するタグ。タグがない場合は空配列を指定する。
          items:
            $ref: "#/components/schemas/Tag"

    ContentAccessConfiguration:
      type: object
      description: クライアントに設定されたコンテンツアクセス設定の有効期限
      additionalProperties: false
      properties:
        invalidAfter:
          type: string
          format: date-time
          description: この時刻以降はコンテンツアクセス設定の有効性を保証しない。有効期限がない場合は省略する。

    SearchCondition:
      type: array
      items:
        $ref: "#/components/schemas/SearchTerm"

    SearchTerm:
      oneOf:
        - $ref: "#/components/schemas/MediaTypeMatchTerm"
        - $ref: "#/components/schemas/TagExistsTerm"
        - $ref: "#/components/schemas/TagMatchTerm"
      discriminator:
        propertyName: kind
        mapping:
          mediaTypeMatch: "#/components/schemas/MediaTypeMatchTerm"
          tagExists: "#/components/schemas/TagExistsTerm"
          tagMatch: "#/components/schemas/TagMatchTerm"

    MediaTypeMatchKind:
      type: string
      const: mediaTypeMatch

    MediaTypeMatchTerm:
      type: object
      description: コンテンツファイルフォーマットが指定値のうちいずれかに一致する場合にマッチする
      additionalProperties: false
      required: [kind, values]
      properties:
        kind:
          $ref: "#/components/schemas/MediaTypeMatchKind"
        values:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MediaType"

    TagExistsKind:
      type: string
      const: tagExists

    TagExistsTerm:
      type: object
      description: |
        指定した名前を持つ、有効なフォーマットかつタグスキーマに整合したタグが型を問わず存在する場合に一致する。
        keyのみのタグも対象とするが無効なフォーマットやスキーマ違反のタグへは判定を行わない。
        指定したkeyが無効なフォーマットであったりタグスキーマ違反であった場合にはエラーとなる。
      additionalProperties: false
      required: [kind, key]
      properties:
        kind:
          $ref: "#/components/schemas/TagExistsKind"
        key:
          $ref: "#/components/schemas/TagKey"

    TagMatchKind:
      type: string
      const: tagMatch

    TagMatchTerm:
      type: object
      description: |
        指定したkeyを持つタグの値が、指定値のいずれかと一致する場合に一致する。
        指定値は文字列で受け取り、そのkeyにタグスキーマの定義があれば定義された型と制約に従って解釈する。
        定義がなければ、keyが許容される場合にTextとして解釈する。値の字句からIntegerやRealを推測しない。
        セット型では定義された要素型で解釈し、いずれかの要素が指定値のいずれかと一致すれば一致する。
        タグが存在しない場合や、定義のないkeyのみのタグに対しては一致しない。
        keyのみと定義されたタグへの値一致、フォーマットが無効なkeyや値、タグスキーマに違反するkeyや値を指定した場合にはエラーとなる。
      additionalProperties: false
      required: [kind, key, values]
      properties:
        kind:
          $ref: "#/components/schemas/TagMatchKind"
        key:
          $ref: "#/components/schemas/TagKey"
        values:
          type: array
          minItems: 1
          description: 各値をタグスキーマの定義またはTextのフォールバックに従って解釈する。空文字列は指定できない。
          items:
            type: string
            minLength: 1

    ContentId:
      type: string
      format: uuid
      description: RFC 9562に準拠したUUID v4形式のコンテンツ識別子
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      example: 2f1c75fc-55de-4d4b-8992-76050f65dff0

    MediaType:
      type: string
      description: コンテンツファイルのメディアタイプ
      enum: [image/avif]

    Content:
      type: object
      description: コンテンツファイルの情報
      additionalProperties: false
      required:
        - id
        - mediaType
        - contentUrl
        - thumbnailUrl
        - tags
        - diagnostics
      properties:
        id:
          $ref: "#/components/schemas/ContentId"
        mediaType:
          $ref: "#/components/schemas/MediaType"
        contentUrl:
          type: string
          format: uri
          pattern: "^https?://"
          description: コンテンツ配信エンドポイントからコンテンツファイルを取得する絶対URL
        thumbnailUrl:
          type: string
          format: uri
          pattern: "^https?://"
          description: サムネイル表示用のコンテンツファイルを取得する絶対URL
        tags:
          type: array
          description: |
            有効なフォーマットかつスキーマが存在する場合にはスキーマと整合するタグ。
            該当するタグがなければ空配列を返す。
            同一コンテンツ内のタグのkeyは一意とし、値や型が異なる場合も同じkeyを持つタグの重複は認めない。
          items:
            $ref: "#/components/schemas/Tag"
        diagnostics:
          type: array
          description: |
            コンテンツのメタデータに関する診断情報。異常がない場合は空配列を返す。
            単一タグに関する異常は同じkeyにつき最大1件とする。
            異常のあるタグはtagsに含めず、タグ検索の対象にも含めない。

            診断の種類（`kind`）:
            - `invalidKey`: XMPプロパティ名がタグキーの条件を満たさない
            - `duplicateKey`: 同じタグキーのXMPプロパティが複数存在する
            - `unsupportedXmpValueType`: XMPの値がタグとして対応しない形式である
            - `notAllowedTagKey`: タグキーがタグスキーマ上許容されない
            - `unparseableTagValue`: XMPの値をスキーマ定義またはフォールバックの型として解釈できない
            - `duplicateSetValue`: セットの要素値を解釈した結果、同じ値が複数存在する
            - `notAllowedTagValue`: 解釈したタグの値がスキーマの制約を満たさない
            - `missingRequiredTag`: 有効なタグの中に必須タグが存在しない

            `definition`フィールドを含む場合、タグスキーマに記載されたタグ定義を示す。
          items:
            $ref: "#/components/schemas/ContentDiagnostic"

    TagKey:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        有効なUTF-8文字列で、デコード後のUnicodeコードポイント列がNFKCで正規化済みのタグ名。
        先頭はUnicode UAX #31のXID_Start、残りはXID_Continueに属する必要がある。
        長さはUnicodeコードポイント数で数える。
      example: category

    TextTagValue:
      type: string
      minLength: 1
      maxLength: 255
      description: 長さが1以上255以下の有効なUTF-8文字列で、デコード後のUnicodeコードポイント列がNFCで正規化済みの値。長さはUnicodeコードポイント数で数える
      example: landscape

    IntegerTagValue:
      type: integer
      format: int64
      minimum: -9007199254740991
      maximum: 9007199254740991
      description: |
        JavaScriptのnumberで安全に扱える整数範囲（-(2^53 - 1)以上、2^53 - 1以下）に限定されたJSON数値
      example: 5

    RealTagValue:
      type: number
      format: double
      description: XMPのRealの字句形式に従い、IEEE 754 binary64の有限値として変換可能な値をJSON数値で返す
      example: 3.14

    Tag:
      description: コンテンツに付与されたタグ
      oneOf:
        - $ref: "#/components/schemas/KeyOnlyTag"
        - $ref: "#/components/schemas/TextTag"
        - $ref: "#/components/schemas/IntegerTag"
        - $ref: "#/components/schemas/RealTag"
        - $ref: "#/components/schemas/TextSetTag"
        - $ref: "#/components/schemas/IntegerSetTag"
        - $ref: "#/components/schemas/RealSetTag"
      discriminator:
        propertyName: type
        mapping:
          keyOnly: "#/components/schemas/KeyOnlyTag"
          text: "#/components/schemas/TextTag"
          integer: "#/components/schemas/IntegerTag"
          real: "#/components/schemas/RealTag"
          textSet: "#/components/schemas/TextSetTag"
          integerSet: "#/components/schemas/IntegerSetTag"
          realSet: "#/components/schemas/RealSetTag"

    KeyOnlyTagType:
      type: string
      const: keyOnly

    TextTagType:
      type: string
      const: text

    IntegerTagType:
      type: string
      const: integer

    RealTagType:
      type: string
      const: real

    TextSetTagType:
      type: string
      const: textSet

    IntegerSetTagType:
      type: string
      const: integerSet

    RealSetTagType:
      type: string
      const: realSet

    InvalidKeyDiagnosticKind:
      type: string
      const: invalidKey

    DuplicateKeyDiagnosticKind:
      type: string
      const: duplicateKey

    UnsupportedXmpValueTypeDiagnosticKind:
      type: string
      const: unsupportedXmpValueType

    NotAllowedTagKeyDiagnosticKind:
      type: string
      const: notAllowedTagKey

    UnparseableTagValueDiagnosticKind:
      type: string
      const: unparseableTagValue

    DuplicateSetValueDiagnosticKind:
      type: string
      const: duplicateSetValue

    NotAllowedTagValueDiagnosticKind:
      type: string
      const: notAllowedTagValue

    MissingRequiredTagDiagnosticKind:
      type: string
      const: missingRequiredTag

    KeyOnlyTag:
      type: object
      description: keyのみのタグ
      additionalProperties: false
      required: [key, type]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          $ref: "#/components/schemas/KeyOnlyTagType"

    TextTag:
      type: object
      description: 単一のText値を持つタグ
      additionalProperties: false
      required: [key, type, value]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          $ref: "#/components/schemas/TextTagType"
        value:
          $ref: "#/components/schemas/TextTagValue"

    IntegerTag:
      type: object
      description: 単一のInteger値を持つタグ
      additionalProperties: false
      required: [key, type, value]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          $ref: "#/components/schemas/IntegerTagType"
        value:
          $ref: "#/components/schemas/IntegerTagValue"

    RealTag:
      type: object
      description: 単一のReal値を持つタグ
      additionalProperties: false
      required: [key, type, value]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          $ref: "#/components/schemas/RealTagType"
        value:
          $ref: "#/components/schemas/RealTagValue"

    TextSetTag:
      type: object
      description: Text値からなる集合のタグ。要素は順序を持たず、値の重複は許可しない。JSONでは配列として表現する
      additionalProperties: false
      required: [key, type, values]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          $ref: "#/components/schemas/TextSetTagType"
        values:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TextTagValue"

    IntegerSetTag:
      type: object
      description: Integer値からなる集合のタグ。要素は順序を持たず、値の重複は許可しない。JSONでは配列として表現する
      additionalProperties: false
      required: [key, type, values]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          $ref: "#/components/schemas/IntegerSetTagType"
        values:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/IntegerTagValue"

    RealSetTag:
      type: object
      description: Real値からなる集合のタグ。要素は順序を持たず、値の重複は許可しない。JSONでは配列として表現する
      additionalProperties: false
      required: [key, type, values]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          $ref: "#/components/schemas/RealSetTagType"
        values:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RealTagValue"

    ContentDiagnostic:
      oneOf:
        - $ref: "#/components/schemas/InvalidKeyDiagnostic"
        - $ref: "#/components/schemas/DuplicateKeyDiagnostic"
        - $ref: "#/components/schemas/UnsupportedXmpValueTypeDiagnostic"
        - $ref: "#/components/schemas/NotAllowedTagKeyDiagnostic"
        - $ref: "#/components/schemas/UnparseableTagValueDiagnostic"
        - $ref: "#/components/schemas/DuplicateSetValueDiagnostic"
        - $ref: "#/components/schemas/NotAllowedTagValueDiagnostic"
        - $ref: "#/components/schemas/MissingRequiredTagDiagnostic"
      discriminator:
        propertyName: kind
        mapping:
          invalidKey: "#/components/schemas/InvalidKeyDiagnostic"
          duplicateKey: "#/components/schemas/DuplicateKeyDiagnostic"
          unsupportedXmpValueType: "#/components/schemas/UnsupportedXmpValueTypeDiagnostic"
          notAllowedTagKey: "#/components/schemas/NotAllowedTagKeyDiagnostic"
          unparseableTagValue: "#/components/schemas/UnparseableTagValueDiagnostic"
          duplicateSetValue: "#/components/schemas/DuplicateSetValueDiagnostic"
          notAllowedTagValue: "#/components/schemas/NotAllowedTagValueDiagnostic"
          missingRequiredTag: "#/components/schemas/MissingRequiredTagDiagnostic"

    InvalidKeyDiagnostic:
      type: object
      additionalProperties: false
      required: [key, kind]
      properties:
        key:
          type: string
          description: 不正なXMPプロパティ名をそのまま返す
          example: Invalid-Key
        kind:
          $ref: "#/components/schemas/InvalidKeyDiagnosticKind"

    DuplicateKeyDiagnostic:
      type: object
      additionalProperties: false
      required: [key, kind]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        kind:
          $ref: "#/components/schemas/DuplicateKeyDiagnosticKind"

    UnsupportedXmpValueTypeDiagnostic:
      type: object
      additionalProperties: false
      required: [key, kind]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        kind:
          $ref: "#/components/schemas/UnsupportedXmpValueTypeDiagnosticKind"

    NotAllowedTagKeyDiagnostic:
      type: object
      additionalProperties: false
      required: [key, kind]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        kind:
          $ref: "#/components/schemas/NotAllowedTagKeyDiagnosticKind"

    UnparseableTagValueDiagnostic:
      type: object
      additionalProperties: false
      required: [key, kind]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        kind:
          $ref: "#/components/schemas/UnparseableTagValueDiagnosticKind"
        definition:
          $ref: "#/components/schemas/TagDefinition"

    DuplicateSetValueDiagnostic:
      type: object
      additionalProperties: false
      required: [key, kind]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        kind:
          $ref: "#/components/schemas/DuplicateSetValueDiagnosticKind"

    NotAllowedTagValueDiagnostic:
      type: object
      additionalProperties: false
      required: [key, kind, definition]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        kind:
          $ref: "#/components/schemas/NotAllowedTagValueDiagnosticKind"
        definition:
          $ref: "#/components/schemas/TagDefinition"

    MissingRequiredTagDiagnostic:
      type: object
      additionalProperties: false
      required: [key, kind, definition]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        kind:
          $ref: "#/components/schemas/MissingRequiredTagDiagnosticKind"
        definition:
          $ref: "#/components/schemas/TagDefinition"

    TagDefinition:
      description: タグスキーマに記載されたタグ定義
      oneOf:
        - $ref: "#/components/schemas/KeyOnlyTagDefinition"
        - $ref: "#/components/schemas/TextTagDefinition"
        - $ref: "#/components/schemas/IntegerTagDefinition"
        - $ref: "#/components/schemas/RealTagDefinition"
        - $ref: "#/components/schemas/TextSetTagDefinition"
        - $ref: "#/components/schemas/IntegerSetTagDefinition"
        - $ref: "#/components/schemas/RealSetTagDefinition"
      discriminator:
        propertyName: type
        mapping:
          keyOnly: "#/components/schemas/KeyOnlyTagDefinition"
          text: "#/components/schemas/TextTagDefinition"
          integer: "#/components/schemas/IntegerTagDefinition"
          real: "#/components/schemas/RealTagDefinition"
          textSet: "#/components/schemas/TextSetTagDefinition"
          integerSet: "#/components/schemas/IntegerSetTagDefinition"
          realSet: "#/components/schemas/RealSetTagDefinition"

    KeyOnlyTagDefinition:
      type: object
      additionalProperties: false
      required: [key, type]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          $ref: "#/components/schemas/KeyOnlyTagType"

    TextTagDefinition:
      type: object
      description: 単一のText値の定義。allowedValuesとminLength・maxLengthは同時に指定しない
      additionalProperties: false
      required: [key, type]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          $ref: "#/components/schemas/TextTagType"
        minLength:
          type: integer
          format: int32
          minimum: 1
          maximum: 255
        maxLength:
          type: integer
          format: int32
          minimum: 1
          maximum: 255
        allowedValues:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TextTagValue"

    IntegerTagDefinition:
      type: object
      description: 単一のInteger値の定義。allowedValuesとmin・maxは同時に指定しない
      additionalProperties: false
      required: [key, type]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          $ref: "#/components/schemas/IntegerTagType"
        min:
          $ref: "#/components/schemas/IntegerTagValue"
        max:
          $ref: "#/components/schemas/IntegerTagValue"
        allowedValues:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/IntegerTagValue"

    RealTagDefinition:
      type: object
      description: 単一のReal値の定義。allowedValuesとmin・maxは同時に指定しない
      additionalProperties: false
      required: [key, type]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          $ref: "#/components/schemas/RealTagType"
        min:
          $ref: "#/components/schemas/RealTagValue"
        max:
          $ref: "#/components/schemas/RealTagValue"
        allowedValues:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RealTagValue"

    TextSetTagDefinition:
      type: object
      description: Text値からなる集合の定義。allowedValuesとminLength・maxLengthは同時に指定しない
      additionalProperties: false
      required: [key, type]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          $ref: "#/components/schemas/TextSetTagType"
        minLength:
          type: integer
          format: int32
          minimum: 1
          maximum: 255
        maxLength:
          type: integer
          format: int32
          minimum: 1
          maximum: 255
        allowedValues:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TextTagValue"

    IntegerSetTagDefinition:
      type: object
      description: Integer値からなる集合の定義。allowedValuesとmin・maxは同時に指定しない
      additionalProperties: false
      required: [key, type]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          $ref: "#/components/schemas/IntegerSetTagType"
        min:
          $ref: "#/components/schemas/IntegerTagValue"
        max:
          $ref: "#/components/schemas/IntegerTagValue"
        allowedValues:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/IntegerTagValue"

    RealSetTagDefinition:
      type: object
      description: Real値からなる集合の定義。allowedValuesとmin・maxは同時に指定しない
      additionalProperties: false
      required: [key, type]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          $ref: "#/components/schemas/RealSetTagType"
        min:
          $ref: "#/components/schemas/RealTagValue"
        max:
          $ref: "#/components/schemas/RealTagValue"
        allowedValues:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RealTagValue"

    ContentPage:
      type: object
      description: カーソル方式でページングされたコンテンツ一覧
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: このページに含まれるコンテンツ
          items:
            $ref: "#/components/schemas/Content"
        nextCursor:
          type: string
          minLength: 1
          description: |
            次ページを取得するためのカーソル。
            最終ページではこのフィールドを返さない。
      dependentSchemas:
        nextCursor:
          properties:
            items:
              minItems: 1
            nextCursor: {}

    Problem:
      type: object
      description: RFC 9457に準拠したAPIエラーの詳細
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: エラー種別を識別するURI参照
          default: about:blank
        title:
          type: string
          description: エラー種別の短い説明
        status:
          type: integer
          description: HTTPステータスコード
        detail:
          type: string
          description: このエラーの具体的な説明
        instance:
          type: string
          format: uri-reference
          description: このエラー発生を識別するURI参照

    BadRequestProblem:
      description: 不正なリクエストを表すProblem Details
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            status:
              type: integer
              const: 400

    ContentNotFoundProblem:
      description: コンテンツが存在しない、または必須のXMPを読み込み・解析できないことを表すProblem Details
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            status:
              type: integer
              const: 404

    UnsupportedMediaTypeProblem:
      description: 対応していないメディアタイプを表すProblem Details
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            status:
              type: integer
              const: 415

    InternalServerErrorProblem:
      description: サーバー内部エラーを表すProblem Details
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            status:
              type: integer
              const: 500

  responses:
    BadRequest:
      description: リクエストパラメーターが不正である
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BadRequestProblem"
          example:
            type: https://api.example.com/problems/invalid-request
            title: Invalid request
            status: 400
            detail: The cursor is invalid or expired.

    ContentNotFound:
      description: コンテンツが存在しないもしくはメタデータを取得できない
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ContentNotFoundProblem"
          example:
            type: https://api.example.com/problems/content-not-found
            title: Content not found
            status: 404
            detail: The requested content does not exist or its metadata cannot be retrieved.

    UnsupportedMediaType:
      description: リクエストのメディアタイプに対応していない
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/UnsupportedMediaTypeProblem"
          example:
            type: https://api.example.com/problems/unsupported-media-type
            title: Unsupported media type
            status: 415
            detail: Only image/avif is supported.

    InternalServerError:
      description: サーバー内部で予期しないエラーが発生した
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/InternalServerErrorProblem"
          example:
            type: https://api.example.com/problems/internal-server-error
            title: Internal server error
            status: 500
