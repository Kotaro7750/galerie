openapi: 3.1.0

info:
  title: Galerie API
  version: 0.3.0
  license:
    name: MIT License
    identifier: MIT
  description: |
    本APIは、Galerieアプリケーションが画像やPDF化した漫画等のマルチメディアを提供するためのAPIである。

    なお、このAPI自体はコンテンツそのものの配信を行うことを想定しておらず、このAPIを利用してコンテンツのメタデータを取得し、その中に含まれる情報を使ってコンテンツを取得することを想定している。

servers:
  - url: /api/v0
    description: API Version 0

tags:
  - name: Contents
    description: コンテンツファイルに関するAPI

security: []

paths:
  /contents:
    get:
      operationId: listContents
      tags:
        - Contents
      summary: コンテンツ一覧の取得
      description: |
        コンテンツの一覧をカーソル方式で取得する。
        最初のリクエストでは`cursor`を指定せず、続きがある場合はレスポンスの`nextCursor`を次のリクエストにそのまま指定する。

        カーソルの値自体は無意味であり、クライアントはその内容を解釈してはいけない。
        コンテンツは`id`の昇順で返される。

        対応するメタデータを読み取れないコンテンツは一覧対象から除外する。
        `limit`・`nextCursor`及び最終ページの判定は除外後のコンテンツ一覧に対して作用する。

        各ページはリクエスト時点のコンテンツを対象とするため、一連の呼び出し中にコンテンツが追加・削除された場合やメタデータの変更によって取得可能性が変わった場合後続のリクエストはその更新の内容を反映する。
        その結果、カーソル以前の位置に追加されたコンテンツやカーソル以降の位置で削除されたコンテンツは以降のリクエストには含まれない。
        最新のコンテンツを取得するためには、`cursor`を指定せずに一覧取得を再開する必要がある。

        `nextCursor`がない場合、そのページは最終ページであり、`items`の要素数は0以上である。
        `nextCursor`がある場合、`items`には1件以上のコンテンツが含まれる。
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: コンテンツ一覧の正常な取得
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPage"
              examples:
                firstPage:
                  summary: 途中のページ
                  value:
                    items:
                      - id: 2f1c75fc-55de-4d4b-8992-76050f65dff0
                        mediaType: image/avif
                        contentUrl: https://content.example.com/2f1c75fc-55de-4d4b-8992-76050f65dff0.avif
                        thumbnailUrl: https://content.example.com/2f1c75fc-55de-4d4b-8992-76050f65dff0.avif
                        tags:
                          - key: category
                            type: text
                            value: landscape
                          - key: animation
                            type: keyOnly
                          - key: rating
                            type: integer
                            value: 5
                          - key: score
                            type: real
                            value: 3.14
                          - key: authors
                            type: textSet
                            values: [Alice, Bob]
                          - key: pages
                            type: integerSet
                            values: [1, 3]
                          - key: weights
                            type: realSet
                            values: [0.5, 1.5]
                        invalidTags:
                          - key: Invalid-Key
                            reason: INVALID_KEY
                          - key: OrderedArray
                            reason: UNSUPPORTED_VALUE_TYPE
                          - key: BooleanFalse
                            reason: INVALID_VALUE
                    nextCursor: eyJhZnRlciI6IjJmMWM3NWZjIn0
                lastPage:
                  summary: 最終ページ
                  value:
                    items:
                      - id: 7b0b8b8e-3c3d-4c12-9a4a-75e60d5c9e31
                        mediaType: image/avif
                        contentUrl: https://content.example.com/7b0b8b8e-3c3d-4c12-9a4a-75e60d5c9e31.avif
                        thumbnailUrl: https://content.example.com/7b0b8b8e-3c3d-4c12-9a4a-75e60d5c9e31.avif
                        tags: []
                        invalidTags: []
                emptyPage:
                  summary: コンテンツが存在しない場合
                  value:
                    items: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /contents/{contentId}:
    get:
      operationId: getContent
      tags:
        - Contents
      summary: コンテンツの取得
      description: |
        個々のコンテンツに対してコンテンツの情報を取得する。
        コンテンツファイルの存在だけではなく対応するメタデータの取得を必須条件とする。

      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: コンテンツの正常な取得
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"
              example:
                id: 2f1c75fc-55de-4d4b-8992-76050f65dff0
                mediaType: image/avif
                contentUrl: https://content.example.com/2f1c75fc-55de-4d4b-8992-76050f65dff0.avif
                thumbnailUrl: https://content.example.com/2f1c75fc-55de-4d4b-8992-76050f65dff0.avif
                tags:
                  - key: category
                    type: text
                    value: landscape
                  - key: animation
                    type: keyOnly
                  - key: rating
                    type: integer
                    value: 5
                  - key: score
                    type: real
                    value: 3.14
                  - key: authors
                    type: textSet
                    values: [Alice, Bob]
                  - key: pages
                    type: integerSet
                    values: [1, 3]
                  - key: weights
                    type: realSet
                    values: [0.5, 1.5]
                invalidTags:
                  - key: Invalid-Key
                    reason: INVALID_KEY
                  - key: OrderedArray
                    reason: UNSUPPORTED_VALUE_TYPE
                  - key: BooleanFalse
                    reason: INVALID_VALUE
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ContentNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    ContentId:
      name: contentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ContentId"

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        一覧取得時のページネーションに用いるカーソル。

      schema:
        type: string
        minLength: 1
      example: eyJhZnRlciI6IjJmMWM3NWZjIn0

    PageLimit:
      name: limit
      in: query
      required: false
      description: |
        1ページに含めるコンテンツの最大件数。
        継続リクエストでは直前のリクエストと異なる値を指定してもよい。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
      example: 30

  schemas:
    ContentId:
      type: string
      format: uuid
      description: RFC 9562に準拠したUUID v4形式のコンテンツ識別子
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      example: 2f1c75fc-55de-4d4b-8992-76050f65dff0

    Content:
      type: object
      description: コンテンツファイルの情報
      additionalProperties: false
      required:
        - id
        - mediaType
        - contentUrl
        - thumbnailUrl
        - tags
        - invalidTags
      properties:
        id:
          $ref: "#/components/schemas/ContentId"
        mediaType:
          type: string
          description: コンテンツファイルのメディアタイプ
          const: image/avif
        contentUrl:
          type: string
          format: uri
          pattern: "^https?://"
          description: コンテンツ配信エンドポイントからコンテンツファイルを取得する絶対URL
        thumbnailUrl:
          type: string
          format: uri
          pattern: "^https?://"
          description: サムネイル表示用のコンテンツファイルを取得する絶対URL
        tags:
          type: array
          description: 有効なタグ。該当するタグがなければ空配列を返す。
          items:
            $ref: "#/components/schemas/Tag"
        invalidTags:
          type: array
          description: 無効なタグ。無効となった簡単な理由を含む。該当するタグがなければ空配列を返す
          items:
            $ref: "#/components/schemas/InvalidTag"

    TagKey:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        有効なUTF-8文字列で、デコード後のUnicodeコードポイント列がNFKCで正規化済みのタグ名。
        先頭はUnicode UAX #31のXID_Start、残りはXID_Continueに属する必要がある。
        長さはUnicodeコードポイント数で数える。
      example: category

    TextTagValue:
      type: string
      description: 有効なUTF-8文字列で、デコード後のUnicodeコードポイント列がNFCで正規化済みの値
      example: landscape

    IntegerTagValue:
      type: integer
      format: int64
      minimum: -9007199254740991
      maximum: 9007199254740991
      description: |
        JavaScriptのnumberで安全に扱える整数範囲（-(2^53 - 1)以上、2^53 - 1以下）に限定されたJSON数値
      example: 5

    RealTagValue:
      type: number
      format: double
      description: XMPのRealの字句形式に従い、IEEE 754 binary64の有限値として変換可能な値をJSON数値で返す
      example: 3.14

    Tag:
      description: コンテンツに付与されたタグ
      oneOf:
        - $ref: "#/components/schemas/KeyOnlyTag"
        - $ref: "#/components/schemas/TextTag"
        - $ref: "#/components/schemas/IntegerTag"
        - $ref: "#/components/schemas/RealTag"
        - $ref: "#/components/schemas/TextSetTag"
        - $ref: "#/components/schemas/IntegerSetTag"
        - $ref: "#/components/schemas/RealSetTag"

    KeyOnlyTag:
      type: object
      description: キーのみのタグ
      additionalProperties: false
      required: [key, type]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          type: string
          const: keyOnly

    TextTag:
      type: object
      description: 単一のText値を持つタグ
      additionalProperties: false
      required: [key, type, value]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          type: string
          const: text
        value:
          $ref: "#/components/schemas/TextTagValue"

    IntegerTag:
      type: object
      description: 単一のInteger値を持つタグ
      additionalProperties: false
      required: [key, type, value]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          type: string
          const: integer
        value:
          $ref: "#/components/schemas/IntegerTagValue"

    RealTag:
      type: object
      description: 単一のReal値を持つタグ
      additionalProperties: false
      required: [key, type, value]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          type: string
          const: real
        value:
          $ref: "#/components/schemas/RealTagValue"

    TextSetTag:
      type: object
      description: Text値からなる集合のタグ。要素は順序を持たず、値の重複は許可しない。JSONでは配列として表現する
      additionalProperties: false
      required: [key, type, values]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          type: string
          const: textSet
        values:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TextTagValue"

    IntegerSetTag:
      type: object
      description: Integer値からなる集合のタグ。要素は順序を持たず、値の重複は許可しない。JSONでは配列として表現する
      additionalProperties: false
      required: [key, type, values]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          type: string
          const: integerSet
        values:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/IntegerTagValue"

    RealSetTag:
      type: object
      description: Real値からなる集合のタグ。要素は順序を持たず、値の重複は許可しない。JSONでは配列として表現する
      additionalProperties: false
      required: [key, type, values]
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        type:
          type: string
          const: realSet
        values:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RealTagValue"

    InvalidTag:
      type: object
      description: |
        無効なタグの情報
      additionalProperties: false
      required: [key, reason]
      properties:
        key:
          type: string
          description: 無効となる該当タグ名
          example: Invalid-Key
        reason:
          type: string
          enum: [INVALID_KEY, UNSUPPORTED_VALUE_TYPE, INVALID_VALUE]
          description: |
            - `INVALID_KEY`: タグ名が条件を満たしていない
            - `UNSUPPORTED_VALUE_TYPE`: タグの型がサポートされていない
            - `INVALID_VALUE`: 値が条件を満たしていない
          example: INVALID_KEY

    ContentPage:
      type: object
      description: カーソル方式でページングされたコンテンツ一覧
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: このページに含まれるコンテンツ
          items:
            $ref: "#/components/schemas/Content"
        nextCursor:
          type: string
          minLength: 1
          description: |
            次ページを取得するためのカーソル。
            最終ページではこのフィールドを返さない。
      dependentSchemas:
        nextCursor:
          properties:
            items:
              minItems: 1
            nextCursor: {}

    Problem:
      type: object
      description: RFC 9457に準拠したAPIエラーの詳細
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: エラー種別を識別するURI参照
          default: about:blank
        title:
          type: string
          description: エラー種別の短い説明
        status:
          type: integer
          description: HTTPステータスコード
        detail:
          type: string
          description: このエラーの具体的な説明
        instance:
          type: string
          format: uri-reference
          description: このエラー発生を識別するURI参照

    BadRequestProblem:
      description: 不正なリクエストを表すProblem Details
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            status:
              type: integer
              const: 400

    ContentNotFoundProblem:
      description: コンテンツが存在しない、または必須のXMPを読み込み・解析できないことを表すProblem Details
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            status:
              type: integer
              const: 404

    InternalServerErrorProblem:
      description: サーバー内部エラーを表すProblem Details
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            status:
              type: integer
              const: 500

  responses:
    BadRequest:
      description: リクエストパラメーターが不正、またはカーソルが無効である
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BadRequestProblem"
          example:
            type: https://api.example.com/problems/invalid-request
            title: Invalid request
            status: 400
            detail: The cursor is invalid or expired.

    ContentNotFound:
      description: コンテンツが存在しないもしくはメタデータを取得できない
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ContentNotFoundProblem"
          example:
            type: https://api.example.com/problems/content-not-found
            title: Content not found
            status: 404
            detail: The requested content does not exist or its metadata cannot be retrieved.

    InternalServerError:
      description: サーバー内部で予期しないエラーが発生した
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/InternalServerErrorProblem"
          example:
            type: https://api.example.com/problems/internal-server-error
            title: Internal server error
            status: 500
