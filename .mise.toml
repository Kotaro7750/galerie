[tasks."backend:dev"]
description = "Start the backend dev server through supervisor"
run = "sudo supervisorctl start backend"

[tasks."backend:stop-dev"]
description = "Stop the backend dev server through supervisor"
run = "sudo supervisorctl stop backend"

[tasks."backend:test"]
description = "Run backend tests"
dir = "backend"
run = "cargo test"

[tasks."backend:lint"]
description = "Run backend clippy"
dir = "backend"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks."backend:fmt"]
description = "Check backend formatting"
dir = "backend"
run = "cargo fmt --all --check"

[tasks."frontend:install"]
description = "Install frontend dependencies"
dir = "frontend"
run = "npm install"

[tasks."frontend:dev"]
description = "Start the frontend dev server through supervisor"
run = "sudo supervisorctl start frontend"

[tasks."frontend:stop-dev"]
description = "Stop the frontend dev server through supervisor"
run = "sudo supervisorctl stop frontend"

[tasks."frontend:test"]
description = "Run frontend tests"
dir = "frontend"
run = "npm run test"

[tasks."frontend:lint"]
description = "Run frontend lint"
dir = "frontend"
run = "npm run lint"

[tasks."frontend:build"]
description = "Build frontend assets"
dir = "frontend"
run = "npm run build"

[tasks."frontend:e2e"]
description = "Run frontend E2E tests"
dir = "frontend"
run = "npm run test:e2e"

[tasks."frontend:e2e-ui"]
description = "Run frontend E2E tests with Playwright UI"
dir = "frontend"
run = "npm run test:e2e:ui"

[tasks."frontend:playwright-install"]
description = "Install Playwright browser dependencies"
dir = "frontend"
run = "npm run playwright:install"
