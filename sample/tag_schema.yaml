version: '0'
allow_additional_tags: true
required:
  subjects:
    type: text_set
optional:
  category:
    type: text
    allowed_values:
      - landscape
      - abstract
  animation:
    type: key_only
  transparent:
    type: key_only
  number:
    type: integer
    min: 0
    max: 100
  real:
    type: real
    min: 0
    max: 100
