[package]
name = "backend"
version = "0.6.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
aws-config = { version = "1.12.0", features = ["credentials-login"] }
aws-sdk-s3 = { version = "1.146.0", features = ["test-util"] }
aws-smithy-async = "1.3.0"
aws-smithy-runtime-api = "1.16.0"
aws-types = "1.6.0"
axum = { version = "0.8.9", features = ["macros"]}
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.22.1"
config = "0.15.25"
error = "0.1.9"
galerie_api = { path = "./openapi_generated/", default-features = false}
headers = "0.4.1"
http = "1.5.0"
mime = "0.3.17"
quick-xml = "0.42.0"
rsa = { version = "0.9.10", features = ["sha1"] }
serde = "1.0.229"
serde_json = "1"
sha1 = "0.10.7"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
unicode-normalization = "0.1.25"
unicode-xid = "0.2.6"
url = "2.5.8"
uuid = { version = "1.24.1", features = ["v4"] }
xmp_toolkit = "1.12.1"

[dev-dependencies]
aws-smithy-mocks = "0.3.0"
