[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"]}
axum-extra = "0.12.6"
config = "0.15.25"
error = "0.1.9"
galerie_api = { path = "./openapi_generated/", default-features = false}
headers = "0.4.1"
http = "1.5.0"
mime = "0.3.17"
serde = "1.0.229"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.24.1", features = ["v4"] }
